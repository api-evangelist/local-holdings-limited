name: Local Holdings Limited
description: Local (uselocal.co) is a Gulf Cooperation Council fintech and hospitality-technology company
  that replaces traditional card terminals with a single QR code guests scan to pay, order, and earn loyalty
  points instantly. Its pay-at-table, checkout, and remote payment-link flows serve 200+ restaurants, hotels,
  and hospitals across Bahrain, the UAE, and Saudi Arabia, capturing customer profiles from each transaction
  and feeding real-time revenue, table-turn, and staff-performance analytics back to venues. Local integrates
  with regional payment methods (BenefitPay, Apple Pay, Google Pay, all major cards) and POS platforms including
  Odoo, Oracle, Lightspeed, Square, and Invo. Local Holdings Limited was surfaced as a 500 Global portfolio
  company and added to the API Evangelist network; no public developer API, documentation, or SDK surface was
  found during enrichment.
